<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolHub — Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0c6e6b">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/animations.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --teal-900: #0a5a54;
            --teal-700: #0c6e6b;
            --teal-500: #14958c;
            --teal-100: #e3f3f1;
            --clay-500: #c87757;
            --ink-900: #1a2b29;
            --ink-500: #5c6b69;
            --paper: #fbfaf7;
            --card: #ffffff;
            --line: #e6e8e5;
            --success: #1a8c5c;
            --danger: #c4453b;
        }

        html, body { height: 100%; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(165deg, var(--teal-900), var(--teal-700) 65%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-900);
            padding: 24px;
            overflow-x: hidden;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            pointer-events: none;
        }
        .bg-orb.one { width: 340px; height: 340px; top: -120px; left: -100px; animation: floatSlow 9s ease-in-out infinite; }
        .bg-orb.two { width: 220px; height: 220px; bottom: -80px; right: -60px; animation: floatSlow 11s ease-in-out infinite reverse; }
        @keyframes floatSlow {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(16px, -20px) scale(1.05); }
        }

        .phone-card {
            position: relative;
            width: 100%;
            max-width: 380px;
            background: var(--card);
            border-radius: 32px;
            box-shadow: 0 30px 70px rgba(5, 40, 37, 0.35);
            overflow: hidden;
            animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-header {
            position: relative;
            background: linear-gradient(150deg, var(--teal-700), var(--teal-900) 80%);
            padding: 40px 32px 64px;
            color: #fff;
            overflow: hidden;
        }
        .card-header::after {
            content: "";
            position: absolute;
            left: -10%;
            right: -10%;
            bottom: -1px;
            height: 60px;
            background: var(--card);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .card-header::before {
            content: "";
            position: absolute;
            width: 220px; height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.10), transparent 70%);
            top: -80px; right: -60px;
        }
        .brand-mark {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        .brand-mark .notch { width: 8px; height: 26px; border-radius: 4px; background: var(--clay-500); }
        .brand-mark .wordmark { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.01em; }
        .card-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-top: 22px;
            position: relative;
            z-index: 1;
        }
        .card-header p {
            font-size: 13.5px;
            color: rgba(255,255,255,0.78);
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .card-body {
            padding: 8px 32px 32px;
        }

        .alert {
            padding: 11px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13.5px;
            display: none;
        }
        .alert.show { display: block; animation: cardIn 0.3s ease; }
        .alert-error { background: #fbeae8; color: var(--danger); border-left: 3px solid var(--danger); }
        .alert-success { background: #e7f5ee; color: var(--success); border-left: 3px solid var(--success); }

        .field {
            position: relative;
            margin-bottom: 18px;
        }
        .field label {
            position: absolute;
            left: 16px;
            top: 14px;
            font-size: 14.5px;
            color: var(--ink-500);
            pointer-events: none;
            transition: all 0.18s ease;
            background: var(--card);
            padding: 0 4px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--line);
            border-radius: 14px;
            font-family: inherit;
            font-size: 14.5px;
            background: var(--card);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field input:focus {
            outline: none;
            border-color: var(--teal-500);
            box-shadow: 0 0 0 4px var(--teal-100);
        }
        .field input:focus + label,
        .field input:not(:placeholder-shown) + label {
            top: -9px;
            left: 12px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--teal-700);
        }

        .forgot-link { text-align: right; margin-bottom: 20px; margin-top: -6px; }
        .forgot-link a, .switch-link a {
            font-size: 12.5px;
            color: var(--teal-700);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .forgot-link a:hover, .switch-link a:hover { text-decoration: underline; }

        .login-btn {
            position: relative;
            width: 100%;
            padding: 15px;
            background: var(--teal-700);
            color: #fff;
            border: none;
            border-radius: 999px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            overflow: hidden;
            transition: background 0.2s ease, transform 0.15s ease;
        }
        .login-btn:hover { background: var(--teal-900); }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:focus-visible { outline: 3px solid var(--teal-100); outline-offset: 2px; }
        .login-btn .btn-label { position: relative; z-index: 1; transition: opacity 0.2s ease; }
        .login-btn .btn-spinner {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            margin: -10px 0 0 -10px;
            border: 2.5px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s ease;
            animation: spin 0.7s linear infinite;
        }
        .login-btn.loading .btn-label { opacity: 0; }
        .login-btn.loading .btn-spinner { opacity: 1; }
        .login-btn.success { background: var(--success); }
        .login-btn.success .btn-label::before { content: "✓ "; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .login-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12.5px;
            color: var(--ink-500);
        }
        .login-footer p:first-child { margin-bottom: 8px; }

        @media (max-width: 420px) {
            .card-header { padding: 32px 24px 56px; }
            .card-body { padding: 8px 24px 28px; }
        }
    </style>
</head>
<body>
    <div class="bg-orb one"></div>
    <div class="bg-orb two"></div>

    <div class="phone-card">
        <div class="card-header">
            <div class="brand-mark">
                <div class="notch"></div>
                <div class="wordmark">SchoolHub</div>
            </div>
            <h1>Welcome back</h1>
            <p>Sign in to your school's dashboard</p>
        </div>

        <div class="card-body">
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="field">
                    <input type="email" id="email" placeholder=" " required>
                    <label for="email">Email Address</label>
                </div>

                <div class="field">
                    <input type="password" id="password" placeholder=" " required>
                    <label for="password">Password</label>
                </div>

                <div class="forgot-link">
                    <a onclick="showForgotPasswordForm(event)">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-label">Sign In</span>
                    <span class="btn-spinner"></span>
                </button>
            </form>

            <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)" style="display: none;">
                <div class="field">
                    <input type="email" id="forgotEmail" placeholder=" " required>
                    <label for="forgotEmail">Enter your account email</label>
                </div>
                <button type="submit" class="login-btn" id="forgotPasswordBtn">
                    <span class="btn-label">Send Reset Link</span>
                    <span class="btn-spinner"></span>
                </button>
                <div class="switch-link" style="text-align: center; margin-top: 16px;">
                    <a onclick="showLoginForm(event)">Back to login</a>
                </div>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="register.html" style="color: var(--teal-700); font-weight: 700; text-decoration: none;">Sign up</a></p>
                <p>© 2026 SchoolHub. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.protocol === "file:" || !window.location.origin || window.location.origin === "null")
            ? "http://127.0.0.1:8000"
            : window.location.origin;

        function showAlert(message, type = "error", redirect = true) {
            const alertId = type === "success" ? "successAlert" : "errorAlert";
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.classList.add("show");

            if (type === "success" && redirect) {
                setTimeout(() => {
                    window.location.href = "professional_dashboard.html";
                }, 1500);
            } else {
                setTimeout(() => alert.classList.remove("show"), 4000);
            }
        }

        function showForgotPasswordForm(event) {
            event.preventDefault();
            document.getElementById("errorAlert").classList.remove("show");
            document.getElementById("successAlert").classList.remove("show");
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("forgotPasswordForm").style.display = "block";
        }

        function showLoginForm(event) {
            event.preventDefault();
            document.getElementById("errorAlert").classList.remove("show");
            document.getElementById("successAlert").classList.remove("show");
            document.getElementById("forgotPasswordForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
        }

        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById("forgotEmail").value;
            const btn = document.getElementById("forgotPasswordBtn");
            btn.classList.add("loading");
            btn.disabled = true;

            try {
                const response = await fetch(API_BASE + "/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await response.json().catch(() => ({}));

                if (response.ok) {
                    showAlert(data.message || "If that email is registered, a reset link has been sent.", "success", false);
                } else {
                    showAlert(data.detail || "Something went wrong. Please try again.", "error");
                }
            } catch (error) {
                showAlert("Network error. Please try again.", "error");
            } finally {
                btn.classList.remove("loading");
                btn.disabled = false;
            }
        }

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");

            if (!email || !password) {
                showAlert("Please enter both email and password", "error");
                return;
            }

            try {
                loginBtn.classList.add("loading");
                loginBtn.disabled = true;

                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Login failed");
                }

                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("user_role", data.role || "user");
                localStorage.setItem("user_full_name", data.full_name || "");
                localStorage.setItem("user_email", data.email || "");
                localStorage.setItem("school_id", data.school_id);
                localStorage.setItem("school_name", data.school_name || "");

                loginBtn.classList.remove("loading");
                loginBtn.classList.add("success");
                loginBtn.querySelector(".btn-label").textContent = "Signed in";
                showAlert("Login successful! Redirecting...", "success");
            } catch (error) {
                showAlert(error.message || "Login failed. Please try again.", "error");
                loginBtn.classList.remove("loading");
                loginBtn.disabled = false;
            }
        }

        window.addEventListener("load", () => {
            const token = localStorage.getItem("access_token");
            if (token) {
                window.location.href = "professional_dashboard.html";
            }
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker.register("sw.js").catch(() => {});
            }
        });
    </script>
    <script src="js/branding.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
