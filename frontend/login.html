<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolHub — Login</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#7C5CE0">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/empty-states.css">
    <link rel="stylesheet" href="css/success-anim.css">
    <link rel="stylesheet" href="css/hope-theme.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body.hope-theme.hope-login-page {
            background: #F7F5FF;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 24px;
            overflow-x: hidden;
        }

        .phone-card {
            position: relative;
            width: 100%;
            max-width: 400px;
            background: var(--ht-bg-primary, #fff);
            border-radius: 32px;
            box-shadow: 0 30px 70px rgba(79, 54, 168, 0.3), 0 0 0 1px rgba(124, 92, 224, 0.08);
            overflow: hidden;
            animation: htSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 2;
        }
        @keyframes htSlideUp {
            from { opacity: 0; transform: translateY(24px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-header {
            position: relative;
            background: linear-gradient(150deg, var(--ht-primary, #7C5CE0), var(--ht-primary-deep, #4F36A8) 80%);
            padding: 40px 32px 64px;
            color: #fff;
            overflow: hidden;
        }
        .card-header::after {
            content: "";
            position: absolute;
            left: -10%;
            right: -10%;
            bottom: -1px;
            height: 60px;
            background: var(--ht-bg-primary, #fff);
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
        }
        .card-header::before {
            content: "";
            position: absolute;
            width: 220px; height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(245, 165, 92, 0.18), transparent 70%);
            top: -80px; right: -60px;
        }
        .brand-mark {
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        .brand-mark .notch {
            width: 8px;
            height: 26px;
            border-radius: 4px;
            background: var(--ht-accent, #F5A55C);
        }
        .brand-mark .wordmark {
            font-family: 'Poppins', sans-serif;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: -0.01em;
        }
        .brand-mark .wordmark .accent { color: var(--ht-accent, #F5A55C); }
        .card-header h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-top: 22px;
            position: relative;
            z-index: 1;
        }
        .card-header p {
            font-size: 13.5px;
            color: rgba(255,255,255,0.85);
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .card-body { padding: 8px 32px 32px; }

        .alert {
            padding: 11px 14px;
            border-radius: 12px;
            margin-bottom: 16px;
            font-size: 13.5px;
            display: none;
            font-weight: 500;
        }
        .alert.show { display: block; animation: htSlideUp 0.3s ease; }
        .alert-error { background: #FEE2E2; color: #991B1B; border-left: 3px solid var(--ht-danger, #EF4444); }
        .alert-success { background: #D1FAE5; color: #065F46; border-left: 3px solid var(--ht-success, #10B981); }

        .field {
            position: relative;
            margin-bottom: 18px;
        }
        .field label {
            position: absolute;
            left: 16px;
            top: 14px;
            font-size: 14.5px;
            color: var(--ht-gray, #6B7280);
            pointer-events: none;
            transition: all 0.18s ease;
            background: var(--ht-bg-primary, #fff);
            padding: 0 4px;
        }
        .field input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--ht-border, #E5E1F5);
            border-radius: 14px;
            font-family: inherit;
            font-size: 14.5px;
            background: var(--ht-bg-primary, #fff);
            color: var(--ht-dark, #1E1B4B);
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .field input:focus {
            outline: none;
            border-color: var(--ht-primary, #7C5CE0);
            box-shadow: 0 0 0 4px rgba(124, 92, 224, 0.12);
        }
        .field input:focus + label,
        .field input:not(:placeholder-shown) + label {
            top: -9px;
            left: 12px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ht-primary, #7C5CE0);
        }

        .field.has-toggle input { padding-right: 44px; }
        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            color: var(--ht-gray, #6B7280);
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.15s;
        }
        .password-toggle-btn:hover { color: var(--ht-primary, #7C5CE0); }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            background: var(--ht-border, #E5E1F5);
            overflow: hidden;
            margin-top: 6px;
        }
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
            border-radius: 2px;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .remember-row input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--ht-primary, #7C5CE0);
            cursor: pointer;
        }
        .remember-row label {
            font-size: 13px;
            color: var(--ht-gray, #6B7280);
            cursor: pointer;
            margin: 0;
            user-select: none;
        }

        .forgot-link { text-align: right; margin-bottom: 20px; margin-top: -6px; }
        .forgot-link a, .switch-link a {
            font-size: 12.5px;
            color: var(--ht-primary, #7C5CE0);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .forgot-link a:hover, .switch-link a:hover { text-decoration: underline; }

        .login-btn {
            position: relative;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--ht-primary, #7C5CE0), var(--ht-primary-dark, #6244C7));
            color: #fff;
            border: none;
            border-radius: 999px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(124, 92, 224, 0.3);
        }
        .login-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 92, 224, 0.45);
        }
        .login-btn:active { transform: scale(0.98); }
        .login-btn .btn-label { position: relative; z-index: 1; transition: opacity 0.2s ease; }
        .login-btn .btn-spinner {
            position: absolute;
            top: 50%; left: 50%;
            width: 20px; height: 20px;
            margin: -10px 0 0 -10px;
            border: 2.5px solid rgba(255,255,255,0.35);
            border-top-color: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s ease;
            animation: htSpin 0.7s linear infinite;
        }
        .login-btn.loading .btn-label { opacity: 0; }
        .login-btn.loading .btn-spinner { opacity: 1; }
        .login-btn.success { background: linear-gradient(135deg, var(--ht-success, #10B981), #059669); }
        @keyframes htSpin { to { transform: rotate(360deg); } }

        .login-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 12.5px;
            color: var(--ht-gray, #6B7280);
        }
        .login-footer p:first-child { margin-bottom: 8px; }
        .login-footer a { color: var(--ht-primary, #7C5CE0); font-weight: 700; text-decoration: none; }
        .login-footer a:hover { text-decoration: underline; }

        @media (max-width: 420px) {
            .card-header { padding: 32px 24px 56px; }
            .card-body { padding: 8px 24px 28px; }
        }
    </style>
</head>
<body class="hope-theme hope-login-page">
    <div class="phone-card">
        <div class="card-header">
            <div class="brand-mark">
                <div class="notch"></div>
                <div class="wordmark">School<span class="accent">Hub</span></div>
            </div>
            <h1>Welcome back 👋</h1>
            <p>Sign in to your school's dashboard</p>
        </div>

        <div class="card-body">
            <div class="alert alert-error" id="errorAlert"></div>
            <div class="alert alert-success" id="successAlert"></div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="field">
                    <input type="email" id="email" placeholder=" " required autocomplete="email">
                    <label for="email">Email Address</label>
                </div>

                <div class="field has-toggle">
                    <input type="password" id="password" placeholder=" " required autocomplete="current-password">
                    <label for="password">Password</label>
                    <button type="button" class="password-toggle-btn" onclick="togglePassword('password', this)" aria-label="Show password">
                        <i data-lucide="eye" style="width:18px;height:18px;"></i>
                    </button>
                </div>

                <div class="password-strength">
                    <div class="password-strength-bar" id="strengthBar"></div>
                </div>

                <div class="remember-row" style="margin-top:14px;">
                    <input type="checkbox" id="rememberMe">
                    <label for="rememberMe">Remember me for 30 days</label>
                </div>

                <div class="forgot-link">
                    <a onclick="showForgotPasswordForm(event)">Forgot Password?</a>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-label">Sign In</span>
                    <span class="btn-spinner"></span>
                </button>
            </form>

            <form id="forgotPasswordForm" onsubmit="handleForgotPassword(event)" style="display: none;">
                <div class="field">
                    <input type="email" id="forgotEmail" placeholder=" " required>
                    <label for="forgotEmail">Enter your account email</label>
                </div>
                <button type="submit" class="login-btn" id="forgotPasswordBtn">
                    <span class="btn-label">Send Reset Link</span>
                    <span class="btn-spinner"></span>
                </button>
                <div class="switch-link" style="text-align: center; margin-top: 16px;">
                    <a onclick="showLoginForm(event)">Back to login</a>
                </div>
            </form>

            <div class="login-footer">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
                <p>© 2026 SchoolHub. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.protocol === "file:" || !window.location.origin || window.location.origin === "null")
            ? "http://127.0.0.1:8000"
            : window.location.origin;

        function showAlert(message, type = "error", redirect = true) {
            if (typeof showToast === "function") {
                showToast(message, type === "success" ? "success" : "error");
                if (type === "success" && redirect) {
                    setTimeout(() => window.location.href = "professional_dashboard.html", 1500);
                }
                return;
            }
            const alertId = type === "success" ? "successAlert" : "errorAlert";
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.classList.add("show");
            if (type === "success" && redirect) {
                setTimeout(() => window.location.href = "professional_dashboard.html", 1500);
            } else {
                setTimeout(() => alert.classList.remove("show"), 4000);
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            if (!input) return;
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            const icon = btn.querySelector("[data-lucide]");
            if (icon) {
                icon.setAttribute("data-lucide", isPassword ? "eye-off" : "eye");
                if (window.lucide) window.lucide.createIcons();
            }
        }

        function updatePasswordStrength(pwd) {
            const bar = document.getElementById("strengthBar");
            if (!bar) return;
            let s = 0;
            if (pwd.length >= 8) s += 30;
            if (pwd.length >= 12) s += 20;
            if (/[A-Z]/.test(pwd)) s += 20;
            if (/[0-9]/.test(pwd)) s += 15;
            if (/[^A-Za-z0-9]/.test(pwd)) s += 15;
            bar.style.width = s + "%";
            bar.style.background = s < 40 ? "#EF4444" : s < 70 ? "#F59E0B" : "#10B981";
        }

        function showForgotPasswordForm(event) {
            event.preventDefault();
            document.getElementById("errorAlert").classList.remove("show");
            document.getElementById("successAlert").classList.remove("show");
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("forgotPasswordForm").style.display = "block";
        }

        function showLoginForm(event) {
            event.preventDefault();
            document.getElementById("errorAlert").classList.remove("show");
            document.getElementById("successAlert").classList.remove("show");
            document.getElementById("forgotPasswordForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
        }

        async function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById("forgotEmail").value;
            const btn = document.getElementById("forgotPasswordBtn");
            btn.classList.add("loading");
            btn.disabled = true;

            try {
                const response = await fetch(API_BASE + "/auth/forgot-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email })
                });
                const data = await response.json().catch(() => ({}));
                if (response.ok) {
                    showAlert(data.message || "If that email is registered, a reset link has been sent.", "success", false);
                } else {
                    showAlert(data.detail || "Something went wrong. Please try again.", "error");
                }
            } catch (error) {
                showAlert("Network error. Please try again.", "error");
            } finally {
                btn.classList.remove("loading");
                btn.disabled = false;
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const loginBtn = document.getElementById("loginBtn");
            const rememberMe = document.getElementById("rememberMe")?.checked;

            if (!email || !password) {
                showAlert("Please enter both email and password", "error");
                return;
            }

            try {
                loginBtn.classList.add("loading");
                loginBtn.disabled = true;

                const response = await fetch(`${API_BASE}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || "Login failed");

                const role = data.role || "staff";
                if (role !== "admin") {
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("user_role");
                    if (role === "teacher") throw new Error("This is the school ADMIN login page. Teachers should use the Teacher Portal. Redirecting you to teacher-login.html…");
                    else if (role === "parent") throw new Error("This is the school ADMIN login page. Parents should use the Parent Portal. Redirecting you to parent-login.html…");
                    else throw new Error("This account does not have admin access. Please contact your school administrator.");
                }

                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("user_role", data.role);
                localStorage.setItem("user_full_name", data.full_name || "");
                localStorage.setItem("user_email", data.email || "");
                localStorage.setItem("school_id", data.school_id);
                localStorage.setItem("school_name", data.school_name || "");

                if (rememberMe) {
                    localStorage.setItem("remember_me", "true");
                    localStorage.setItem("remembered_email", email);
                } else {
                    localStorage.removeItem("remember_me");
                    localStorage.removeItem("remembered_email");
                }

                loginBtn.classList.remove("loading");
                loginBtn.classList.add("success");
                loginBtn.querySelector(".btn-label").textContent = "Signed in ✓";
                showAlert("Login successful! Redirecting...", "success");
            } catch (error) {
                showAlert(error.message || "Login failed. Please try again.", "error");
                loginBtn.classList.remove("loading");
                loginBtn.disabled = false;

                if (error.message && error.message.includes("Redirecting")) {
                    const target = error.message.includes("teacher-login") ? "teacher-login.html" :
                        error.message.includes("parent-login") ? "parent-login.html" : null;
                    if (target) setTimeout(() => { window.location.href = target; }, 2500);
                }
            }
        }

        window.addEventListener("load", () => {
            const token = localStorage.getItem("access_token");
            const role = localStorage.getItem("user_role");

            if (token && role === "admin") {
                window.location.href = "professional_dashboard.html";
                return;
            }
            if (token && role !== "admin") {
                localStorage.removeItem("access_token");
                localStorage.removeItem("user_role");
            }

            const rememberedEmail = localStorage.getItem("remembered_email");
            const rememberFlag = localStorage.getItem("remember_me");
            if (rememberedEmail && rememberFlag === "true") {
                document.getElementById("email").value = rememberedEmail;
                document.getElementById("rememberMe").checked = true;
            }

            if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

            const pwdInput = document.getElementById("password");
            if (pwdInput) pwdInput.addEventListener("input", (e) => updatePasswordStrength(e.target.value));

            if (window.lucide) window.lucide.createIcons();
        });
    </script>

    <script src="js/branding.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/empty-states.js"></script>
    <script src="js/success-anim.js"></script>
    <script src="js/form-validation.js"></script>
    <script src="js/hope-theme.js"></script>
</body>
</html>
