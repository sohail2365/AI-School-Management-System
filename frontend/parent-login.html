<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parent Portal — SchoolHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/dark-mode.css">
<link rel="stylesheet" href="css/empty-states.css">
<link rel="stylesheet" href="css/success-anim.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --teal-900: #0a5a54; --teal-700: #0c6e6b; --teal-500: #14958c; --teal-100: #e3f3f1;
    --clay-500: #c87757; --ink-900: #1a2b29; --ink-500: #5c6b69;
    --paper: #fbfaf7; --card: #ffffff; --line: #e6e8e5; --danger: #c4453b;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',sans-serif; background:var(--paper); min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; color:var(--ink-900); }
  .box { background:var(--card); padding:2.5rem; border-radius:20px; box-shadow:0 10px 30px rgba(10,90,84,0.08); width:100%; max-width:380px; }
  .brand { display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .notch { width:8px; height:26px; border-radius:4px; background:var(--clay-500); }
  .word { font-family:'Poppins',sans-serif; font-weight:800; font-size:20px; color:var(--teal-900); }
  h1 { font-family:'Poppins',sans-serif; font-size:19px; margin:18px 0 4px; }
  p.sub { color:var(--ink-500); font-size:13.5px; margin:0 0 24px; }
  label { display:block; font-weight:600; font-size:13px; margin:0 0 6px; }
  input { width:100%; padding:11px 13px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; margin-bottom:16px; font-family:inherit; }
  input:focus { outline:none; border-color:var(--teal-500); box-shadow:0 0 0 3px var(--teal-100); }
  button { width:100%; padding:12px; border:none; border-radius:10px; background:var(--teal-700); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer; }
  button:hover { background:var(--teal-900); }
  button:disabled { opacity:0.6; cursor:not-allowed; }
  .error { color:var(--danger); font-size:13px; margin-top:10px; display:none; background:#fbeae8; padding:9px 12px; border-radius:8px; }
  .back { display:block; text-align:center; margin-top:18px; font-size:13px; color:var(--ink-500); text-decoration:none; }
</style>
</head>
<body>
  <div class="box">
    <div class="brand"><div class="notch"></div><div class="word">SchoolHub</div></div>
    <h1>Parent Portal</h1>
    <p class="sub">Sign in with the email &amp; password your school gave you.</p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username" />
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit" id="loginBtn">Log In</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <a class="back" href="login.html">← School staff login</a>
  </div>

<script>
const API_BASE = (window.location.protocol === "file:" || !window.location.origin || window.location.origin === "null")
    ? "http://127.0.0.1:8000" : window.location.origin;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById("errorMsg");
  const btn = document.getElementById("loginBtn");
  errorMsg.style.display = "none";
  btn.disabled = true; btn.textContent = "Logging in...";

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Login failed");
    if (data.role !== "parent") throw new Error("This login is not registered as a parent account.");

    localStorage.setItem("parent_token", data.access_token);
    window.location.href = "parent-dashboard.html";
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Log In";
  }
});
</script>
<script src="js/branding.js"></script>
<script src="js/animations.js"></script>
<script src="js/dark-mode.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/empty-states.js"></script>
<script src="js/success-anim.js"></script>
</body>
</html>
