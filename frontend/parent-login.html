<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parent Portal — SchoolHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/dark-mode.css">
<link rel="stylesheet" href="css/empty-states.css">
<link rel="stylesheet" href="css/success-anim.css">
<link rel="stylesheet" href="css/hope-theme.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body.hope-theme.hope-login-page {
    background: #F7F5FF;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0;
    padding: 20px;
  }
  .box {
    background: #fff;
    padding: 2.5rem;
    border-radius: 24px;
    box-shadow: 0 24px 60px rgba(79, 54, 168, 0.25);
    width: 100%;
    max-width: 420px;
    border: 1px solid rgba(124, 92, 224, 0.08);
    position: relative;
    z-index: 2;
    animation: htSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes htSlideUp {
    from { transform: translateY(24px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .brand-logo {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, #FFF8F0, #FFE6C7);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 12px rgba(245, 165, 92, 0.35);
  }
  .brand-logo svg { width: 26px; height: 26px; }
  .brand-text {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: 0.5px;
    color: var(--ht-primary-dark, #6244C7);
  }
  .brand-text .accent { color: var(--ht-accent, #F5A55C); }

  .box h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 1.4rem;
    font-weight: 700;
    margin: 22px 0 6px;
    color: var(--ht-dark, #1E1B4B);
  }
  .box p.sub {
    color: var(--ht-gray, #6B7280);
    font-size: 0.88rem;
    margin: 0 0 1.6rem;
    line-height: 1.5;
  }
  .box label {
    display: block;
    font-weight: 600;
    font-size: 0.82rem;
    margin: 0 0 0.4rem;
    color: var(--ht-dark, #1E1B4B);
  }
  .box input {
    width: 100%;
    padding: 0.75rem 0.9rem;
    border: 1.5px solid var(--ht-border, #E5E1F5);
    border-radius: 12px;
    font-size: 0.92rem;
    margin-bottom: 1rem;
    font-family: inherit;
    background: #fff;
    color: var(--ht-dark, #1E1B4B);
    transition: border-color 0.15s, box-shadow 0.15s;
    box-sizing: border-box;
  }
  .box input:focus {
    outline: none;
    border-color: var(--ht-primary, #7C5CE0);
    box-shadow: 0 0 0 4px rgba(124, 92, 224, 0.12);
  }
  .box button {
    width: 100%;
    padding: 0.85rem;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--ht-primary, #7C5CE0), var(--ht-primary-dark, #6244C7));
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 14px rgba(124, 92, 224, 0.3);
    font-family: inherit;
  }
  .box button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(124, 92, 224, 0.45);
  }
  .box button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error {
    color: #991B1B;
    font-size: 0.82rem;
    margin-top: 0.9rem;
    display: none;
    background: #FEE2E2;
    padding: 10px 14px;
    border-radius: 10px;
    border-left: 4px solid var(--ht-danger, #EF4444);
    font-weight: 500;
  }
  .back {
    display: block;
    text-align: center;
    margin-top: 1.4rem;
    font-size: 0.82rem;
    color: var(--ht-gray, #6B7280);
    text-decoration: none;
    transition: color 0.15s;
  }
  .back:hover { color: var(--ht-primary, #7C5CE0); font-weight: 600; }
</style>
</head>
<body class="hope-theme hope-login-page">
  <div class="box">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3v2M10 5h4M9 8a3 3 0 016 0v3a4 4 0 01-1 2.65V15h-4v-1.35A4 4 0 019 11V8z" stroke="#7C5CE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 18h6M10 20h4" stroke="#F5A55C" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="16.5" cy="9.5" r="1.6" fill="#F5A55C"/>
        </svg>
      </div>
      <div class="brand-text">School<span class="accent">Hub</span></div>
    </div>
    <h1>Parent Portal</h1>
    <p class="sub">Sign in with the email &amp; password your school gave you.</p>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="username" placeholder="parent@example.com" />
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password" placeholder="Enter your password" />
      <button type="submit" id="loginBtn">Log In</button>
      <div class="error" id="errorMsg"></div>
    </form>
    <a class="back" href="login.html">← School staff login</a>
  </div>

<script>
const API_BASE = (window.location.protocol === "file:" || !window.location.origin || window.location.origin === "null")
    ? "http://127.0.0.1:8000" : window.location.origin;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById("errorMsg");
  const btn = document.getElementById("loginBtn");
  errorMsg.style.display = "none";
  btn.disabled = true; btn.textContent = "Logging in...";

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Login failed");
    if (data.role !== "parent") throw new Error("This login is not registered as a parent account.");

    localStorage.setItem("parent_token", data.access_token);
    window.location.href = "parent-dashboard.html";
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.style.display = "block";
  } finally {
    btn.disabled = false; btn.textContent = "Log In";
  }
});
</script>
<script src="js/branding.js"></script>
<script src="js/animations.js"></script>
<script src="js/dark-mode.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/empty-states.js"></script>
<script src="js/success-anim.js"></script>
<script src="js/hope-theme.js"></script>
</body>
</html>
