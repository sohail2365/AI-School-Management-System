<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/empty-states.css">
    <link rel="stylesheet" href="css/success-anim.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(165deg, #0a5a54, #0c6e6b 70%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 28px;
            margin: 0 0 10px 0;
        }
        p {
            margin: 0;
            font-size: 16px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h1>🎓 SchoolHub</h1>
        <p>Professional Dashboard Loading...</p>
    </div>

    <script>
        // Redirect to professional login
        window.location.href = "login.html";
    </script>
    <script src="js/branding.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/empty-states.js"></script>
    <script src="js/success-anim.js"></script>
</body>
</html>
