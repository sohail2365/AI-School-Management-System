<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Parent Portal — SchoolHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/empty-states.css">
<link rel="stylesheet" href="css/success-anim.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --teal-900: #0a5a54; --teal-700: #0c6e6b; --teal-500: #14958c; --teal-100: #e3f3f1;
    --clay-500: #c87757; --ink-900: #1a2b29; --ink-500: #5c6b69;
    --paper: #fbfaf7; --card: #ffffff; --line: #e6e8e5;
    --success: #1a8c5c; --danger: #c4453b; --warn: #c78a1e;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Inter',sans-serif; background:var(--paper); color:var(--ink-900); }
  .topbar { background:linear-gradient(165deg,var(--teal-900),var(--teal-700) 70%); color:#fff; padding:1rem 1.5rem; display:flex; justify-content:space-between; align-items:center; }
  .topbar .brand { display:flex; align-items:center; gap:10px; }
  .topbar .notch { width:8px; height:24px; border-radius:4px; background:var(--clay-500); }
  .topbar .word { font-family:'Poppins',sans-serif; font-weight:800; font-size:18px; }
  .topbar button { background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:0.4rem 0.9rem; border-radius:8px; cursor:pointer; font-size:13px; }
  .container { max-width:920px; margin:1.5rem auto; padding:0 1rem 3rem; }
  .card { background:var(--card); border-radius:14px; padding:1.3rem 1.5rem; margin-bottom:1.2rem; box-shadow:0 2px 12px rgba(10,90,84,0.06); border:1px solid var(--line); transition: box-shadow 0.25s ease; }
  .card:hover { box-shadow: 0 8px 24px rgba(10,90,84,0.10); }
  .card h2 { font-family:'Poppins',sans-serif; font-size:1.05rem; margin:0 0 1rem; }
  .student-hero { display:flex; align-items:center; gap:14px; }
  .student-avatar { width:52px; height:52px; border-radius:50%; background:var(--teal-100); color:var(--teal-900); display:flex; align-items:center; justify-content:center; font-family:'Poppins',sans-serif; font-weight:700; font-size:20px; flex-shrink:0; }
  .student-hero h1 { font-family:'Poppins',sans-serif; font-size:1.2rem; margin:0; }
  .student-hero .meta { color:var(--ink-500); font-size:0.88rem; margin-top:2px; }
  .tabs { display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; }
  .tab-btn { padding:0.5rem 1rem; border:1px solid var(--line); background:var(--card); border-radius:10px; cursor:pointer; font-size:0.88rem; font-weight:600; color:var(--ink-500); transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease, transform 0.15s ease; }
  .tab-btn:hover { transform: translateY(-1px); border-color: var(--teal-500); color: var(--teal-700); }
  .tab-btn.active { background:var(--teal-700); color:#fff; border-color:var(--teal-700); }
  table { width:100%; border-collapse:collapse; font-size:0.9rem; }
  th, td { text-align:left; padding:0.55rem 0.6rem; border-bottom:1px solid var(--line); }
  th { color:var(--ink-500); font-weight:600; font-size:0.8rem; text-transform:uppercase; letter-spacing:0.02em; }
  .pill { display:inline-block; padding:0.15rem 0.6rem; border-radius:999px; font-size:0.78rem; font-weight:600; }
  .pill.present, .pill.paid { background:#e7f5ee; color:var(--success); }
  .pill.absent, .pill.unpaid { background:#fbeae8; color:var(--danger); }
  .pill.partial { background:#fdf3e3; color:var(--warn); }
  .empty { color:var(--ink-500); padding:1rem 0; font-size:0.9rem; }
  .disabled-note { color:var(--ink-500); font-size:0.88rem; background:var(--paper); padding:0.8rem 1rem; border-radius:10px; border:1px dashed var(--line); }
  .payment-box { background:var(--teal-100); border-radius:10px; padding:1rem 1.2rem; margin-bottom:1rem; white-space:pre-line; font-size:0.9rem; line-height:1.6; }
  .msg-list { max-height:340px; overflow-y:auto; margin-bottom:1rem; display:flex; flex-direction:column; gap:8px; }
  .msg-bubble { max-width:75%; padding:0.6rem 0.9rem; border-radius:12px; font-size:0.88rem; line-height:1.4; }
  .msg-bubble.parent { align-self:flex-end; background:var(--teal-700); color:#fff; border-bottom-right-radius:3px; }
  .msg-bubble.staff { align-self:flex-start; background:var(--paper); border:1px solid var(--line); border-bottom-left-radius:3px; }
  .msg-time { font-size:0.7rem; opacity:0.7; margin-top:3px; }
  .msg-form { display:flex; gap:8px; }
  .msg-form input { flex:1; padding:0.6rem 0.8rem; border:1.5px solid var(--line); border-radius:10px; font-size:0.9rem; font-family:inherit; }
  .msg-form button { padding:0.6rem 1.1rem; border:none; border-radius:10px; background:var(--teal-700); color:#fff; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><div class="notch"></div><div class="word">SchoolHub — Parent Portal</div></div>
    <button onclick="logout()">Log out</button>
  </div>

  <div class="container">
    <div class="card">
      <div class="student-hero">
        <div class="student-avatar" id="studentInitial">?</div>
        <div>
          <h1 id="studentName">Loading…</h1>
          <div class="meta" id="studentMeta"></div>
        </div>
      </div>
    </div>

    <div class="tabs" id="tabBar"></div>

    <div class="card" id="tab-attendance" style="display:none">
      <h2>Attendance</h2>
      <div id="attendanceContent"><div class="empty">Loading…</div></div>
    </div>

    <div class="card" id="tab-grades" style="display:none">
      <h2>Grades &amp; Test Records</h2>
      <div id="gradesContent"><div class="empty">Loading…</div></div>
    </div>

    <div class="card" id="tab-fees" style="display:none">
      <h2>Fees</h2>
      <div id="feesContent"><div class="empty">Loading…</div></div>
    </div>

    <div class="card" id="tab-messages" style="display:none">
      <h2>Messages</h2>
      <div id="messagesContent"><div class="empty">Loading…</div></div>
    </div>
  </div>

<script>
const API_BASE = (window.location.protocol === "file:" || !window.location.origin || window.location.origin === "null")
    ? "http://127.0.0.1:8000" : window.location.origin;

const token = localStorage.getItem("parent_token");
if (!token) window.location.href = "parent-login.html";

let visibility = {};

function logout() {
  localStorage.removeItem("parent_token");
  window.location.href = "parent-login.html";
}

async function api(path, options = {}) {
  const headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    if (res.status === 401) logout();
    throw new Error(data.detail || "Request failed");
  }
  return data;
}

function timeAgo(iso) {
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

async function init() {
  try {
    const me = await api("/parent/me");
    visibility = me.visibility;
    const s = me.student;

    document.getElementById("studentInitial").textContent = (s.name || "?").charAt(0).toUpperCase();
    document.getElementById("studentName").textContent = s.name;
    document.getElementById("studentMeta").textContent =
      `Class ${s.class_name || "-"} · Roll No ${s.roll_number || "-"}`;

    const tabs = [];
    if (visibility.attendance) tabs.push(["attendance", "Attendance"]);
    if (visibility.grades) tabs.push(["grades", "Grades"]);
    if (visibility.fees) tabs.push(["fees", "Fees"]);
    if (visibility.messages) tabs.push(["messages", "Messages"]);

    if (tabs.length === 0) {
      document.getElementById("tabBar").innerHTML =
        `<div class="disabled-note">Your school hasn't enabled any portal sections yet. Please check back later.</div>`;
      return;
    }

    document.getElementById("tabBar").innerHTML = tabs.map(([id, label], i) =>
      `<button class="tab-btn ${i === 0 ? "active" : ""}" data-tab="${id}" onclick="switchTab('${id}')">${label}</button>`
    ).join("");

    switchTab(tabs[0][0]);

    if (visibility.fees) loadFees(me.payment_info);
    if (visibility.attendance) loadAttendance();
    if (visibility.grades) loadGrades();
    if (visibility.messages) loadMessages();
  } catch (err) {
    document.getElementById("studentName").textContent = err.message;
  }
}

function switchTab(tab) {
  ["attendance", "grades", "fees", "messages"].forEach(t => {
    const el = document.getElementById(`tab-${t}`);
    if (el) el.style.display = t === tab ? "block" : "none";
  });
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
}

async function loadAttendance() {
  const el = document.getElementById("attendanceContent");
  try {
    const records = await api("/parent/attendance");
    if (records.length === 0) { el.innerHTML = `<div class="empty">No attendance recorded yet.</div>`; return; }
    const presentCount = records.filter(r => r.is_present).length;
    el.innerHTML = `
      <p style="color:var(--ink-500); font-size:0.88rem; margin-top:0;">Present ${presentCount} of ${records.length} recorded days</p>
      <table><thead><tr><th>Date</th><th>Status</th><th>Remarks</th></tr></thead><tbody>
        ${records.map(r => `<tr>
          <td>${r.date}</td>
          <td><span class="pill ${r.is_present ? "present" : "absent"}">${r.is_present ? "Present" : "Absent"}</span></td>
          <td>${r.remarks || "—"}</td>
        </tr>`).join("")}
      </tbody></table>`;
  } catch (err) {
    el.innerHTML = `<div class="disabled-note">${err.message}</div>`;
  }
}

async function loadGrades() {
  const el = document.getElementById("gradesContent");
  try {
    const [grades, testRecords] = await Promise.all([
      api("/parent/grades"), api("/parent/test-records"),
    ]);
    let html = "";
    if (grades.length > 0) {
      html += `<h3 style="font-size:0.9rem; margin-bottom:6px;">Grades</h3><table><thead><tr><th>Subject</th><th>Marks</th><th>%</th><th>Date</th></tr></thead><tbody>
        ${grades.map(g => `<tr><td>${g.subject}</td><td>${g.marks_obtained}/${g.total_marks}</td><td>${g.percentage}%</td><td>${g.exam_date || "—"}</td></tr>`).join("")}
      </tbody></table>`;
    }
    if (testRecords.length > 0) {
      html += `<h3 style="font-size:0.9rem; margin:16px 0 6px;">Test Records</h3><table><thead><tr><th>Term</th><th>Period</th><th>Subject</th><th>Marks</th></tr></thead><tbody>
        ${testRecords.map(t => `<tr><td>${t.term_type}</td><td>${t.period}</td><td>${t.subject}</td><td>${t.marks_obtained}/${t.total_marks} (${t.percentage}%)</td></tr>`).join("")}
      </tbody></table>`;
    }
    el.innerHTML = html || `<div class="empty">No grades recorded yet.</div>`;
  } catch (err) {
    el.innerHTML = `<div class="disabled-note">${err.message}</div>`;
  }
}

async function loadFees(paymentInfo) {
  const el = document.getElementById("feesContent");
  try {
    const fees = await api("/parent/fees");
    let html = "";
    if (paymentInfo) {
      html += `<div class="payment-box"><strong>How to pay:</strong>\n${paymentInfo}</div>`;
    }
    if (fees.length === 0) {
      html += `<div class="empty">No fee records yet.</div>`;
    } else {
      html += `<table><thead><tr><th>Month</th><th>Fee</th><th>Due</th><th>Paid</th><th>Status</th></tr></thead><tbody>
        ${fees.map(f => `<tr>
          <td>${f.month || "—"}</td>
          <td>${f.fee_name}</td>
          <td>Rs. ${f.due_amount}</td>
          <td>Rs. ${f.paid_amount}</td>
          <td><span class="pill ${f.status}">${f.status}</span></td>
        </tr>`).join("")}
      </tbody></table>`;
    }
    el.innerHTML = html;
  } catch (err) {
    el.innerHTML = `<div class="disabled-note">${err.message}</div>`;
  }
}

async function loadMessages() {
  const el = document.getElementById("messagesContent");
  try {
    const messages = await api("/parent/messages");
    el.innerHTML = `
      <div class="msg-list" id="msgList">
        ${messages.length === 0 ? '<div class="empty">No messages yet — say hello to your school!</div>' :
          messages.map(m => `
            <div class="msg-bubble ${m.sender_role === "parent" ? "parent" : "staff"}">
              ${m.message}
              <div class="msg-time">${timeAgo(m.created_at)}</div>
            </div>`).join("")}
      </div>
      <div class="msg-form">
        <input type="text" id="msgInput" placeholder="Type a message to the school..." />
        <button onclick="sendMessage()">Send</button>
      </div>`;
    const list = document.getElementById("msgList");
    list.scrollTop = list.scrollHeight;
  } catch (err) {
    el.innerHTML = `<div class="disabled-note">${err.message}</div>`;
  }
}

async function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  try {
    await api(`/parent/messages?message=${encodeURIComponent(text)}`, { method: "POST" });
    input.value = "";
    await loadMessages();
  } catch (err) {
    alert(err.message);
  }
}

async function applyPortalBackground() {
  try {
    const result = await api("/settings/background-image");
    if (result.url) {
      document.body.style.backgroundImage =
        `linear-gradient(rgba(251,250,247,0.55), rgba(251,250,247,0.72)), url('${result.url}')`;
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundAttachment = "fixed";
      document.body.style.backgroundPosition = "center";
    }
  } catch (e) { /* no background set — fine */ }
}
applyPortalBackground();

init();
</script>
<script src="js/branding.js"></script>
<script src="js/animations.js"></script>
<script src="js/dark-mode.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/empty-states.js"></script>
<script src="js/success-anim.js"></script>
</body>
</html>
