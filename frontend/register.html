<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SchoolHub — Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/dark-mode.css">
    <link rel="stylesheet" href="css/empty-states.css">
    <link rel="stylesheet" href="css/success-anim.css">
    <link rel="stylesheet" href="css/hope-theme.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        body.hope-theme.hope-login-page {
            background: #F7F5FF;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 500px;
            background: var(--ht-bg-primary, #fff);
            border-radius: 24px;
            box-shadow: 0 24px 60px rgba(79, 54, 168, 0.25);
            padding: 40px;
            border: 1px solid rgba(124, 92, 224, 0.08);
            animation: htSlideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 2;
        }
        @keyframes htSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-header { text-align: center; margin-bottom: 30px; }

        .logo-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFF8F0, #FFE6C7);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            box-shadow: 0 8px 24px rgba(245, 165, 92, 0.4), 0 0 0 6px rgba(255, 255, 255, 0.15);
        }
        .logo-icon svg { width: 40px; height: 40px; }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-size: 26px;
            font-weight: 800;
            color: var(--ht-primary-dark, #6244C7);
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }
        .logo-text .accent { color: var(--ht-accent, #F5A55C); }
        .logo-subtitle { font-size: 13.5px; color: var(--ht-gray, #6B7280); }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 28px;
            background: var(--ht-bg-secondary, #F7F5FF);
            padding: 6px;
            border-radius: 14px;
            border: 1px solid var(--ht-border, #E5E1F5);
        }
        .tab-button {
            flex: 1;
            padding: 11px;
            border: none;
            background: none;
            font-weight: 700;
            color: var(--ht-gray, #6B7280);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.25s ease;
            font-size: 14px;
            font-family: inherit;
        }
        .tab-button.active {
            background: linear-gradient(135deg, var(--ht-primary, #7C5CE0), var(--ht-primary-dark, #6244C7));
            color: #fff;
            box-shadow: 0 4px 14px rgba(124, 92, 224, 0.3);
        }
        .tab-button:hover:not(.active) { color: var(--ht-primary, #7C5CE0); }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            font-weight: 600;
            color: var(--ht-dark, #1E1B4B);
            margin-bottom: 7px;
            font-size: 13px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1.5px solid var(--ht-border, #E5E1F5);
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
            background: var(--ht-bg-primary, #fff);
            color: var(--ht-dark, #1E1B4B);
            transition: all 0.15s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--ht-primary, #7C5CE0);
            box-shadow: 0 0 0 4px rgba(124, 92, 224, 0.12);
        }
        .form-group input::placeholder { color: #B0A8C8; }

        .password-strength {
            margin-top: 6px;
            height: 4px;
            border-radius: 2px;
            background: var(--ht-border, #E5E1F5);
            overflow: hidden;
        }
        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: all 0.3s;
            border-radius: 2px;
        }
        .password-hint { font-size: 11.5px; color: var(--ht-gray, #6B7280); margin-top: 4px; }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--ht-primary, #7C5CE0), var(--ht-primary-dark, #6244C7));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            font-family: inherit;
            box-shadow: 0 4px 14px rgba(124, 92, 224, 0.3);
        }
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(124, 92, 224, 0.45);
        }
        .submit-btn:active { transform: translateY(0); }
        .submit-btn.loading, .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        .alert {
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 500;
            font-size: 13.5px;
        }
        .alert.show { display: block; animation: htSlideDown 0.3s ease; }
        .alert-success { background: #D1FAE5; color: #065F46; border-left: 4px solid var(--ht-success, #10B981); }
        .alert-error { background: #FEE2E2; color: #991B1B; border-left: 4px solid var(--ht-danger, #EF4444); }
        .alert-info { background: #DBEAFE; color: #1E40AF; border-left: 4px solid var(--ht-info, #3B82F6); }
        @keyframes htSlideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--ht-gray, #6B7280);
        }
        .footer-text a {
            color: var(--ht-primary, #7C5CE0);
            text-decoration: none;
            font-weight: 700;
        }
        .footer-text a:hover { text-decoration: underline; }

        .debug-info {
            background: var(--ht-bg-secondary, #F7F5FF);
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 12px;
            color: var(--ht-dark, #1E1B4B);
            display: none;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            border: 1px solid var(--ht-border, #E5E1F5);
        }
        .debug-info.show { display: block; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: htSpin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes htSpin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .auth-container { padding: 30px 22px; }
            .logo-text { font-size: 22px; }
            .logo-icon { width: 60px; height: 60px; }
            .logo-icon svg { width: 34px; height: 34px; }
        }
    </style>
</head>
<body class="hope-theme hope-login-page">
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 3v2M10 5h4M9 8a3 3 0 016 0v3a4 4 0 01-1 2.65V15h-4v-1.35A4 4 0 019 11V8z" stroke="#7C5CE0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M9 18h6M10 20h4" stroke="#F5A55C" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="16.5" cy="9.5" r="1.6" fill="#F5A55C"/>
                </svg>
            </div>
            <div class="logo-text">School<span class="accent">Hub</span></div>
            <div class="logo-subtitle">Professional School Management</div>
        </div>

        <div class="alert alert-success" id="successAlert"></div>
        <div class="alert alert-error" id="errorAlert"></div>
        <div class="alert alert-info" id="infoAlert"></div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('login')">🔐 Login</button>
            <button class="tab-button" onclick="switchTab('register')">✍️ Register</button>
        </div>

        <div class="tab-content active" id="loginTab">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="loginEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">Sign In</button>
            </form>
            <div class="debug-info" id="loginDebugInfo"></div>
        </div>

        <div class="tab-content" id="registerTab">
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label>School Name *</label>
                    <input type="text" id="registerSchoolName" placeholder="Your school name" required>
                </div>
                <div class="form-group">
                    <label>Admin Full Name *</label>
                    <input type="text" id="registerAdminName" placeholder="Your full name" required>
                </div>
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="registerEmail" placeholder="your@email.com" required>
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="registerPassword" placeholder="At least 8 characters" required oninput="checkPasswordStrength()">
                    <div class="password-strength">
                        <div class="password-strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="password-hint" id="passwordHint">Minimum 8 characters</div>
                </div>
                <div class="form-group">
                    <label>Confirm Password *</label>
                    <input type="password" id="registerPasswordConfirm" placeholder="Confirm password" required>
                </div>
                <div class="form-group">
                    <label>School Phone (Optional)</label>
                    <input type="tel" id="registerPhone" placeholder="e.g., 03001234567">
                </div>
                <div class="form-group">
                    <label>School City (Optional)</label>
                    <input type="text" id="registerCity" placeholder="e.g., Lahore">
                </div>
                <button type="submit" class="submit-btn" id="registerBtn">Create Account</button>
            </form>
            <div class="debug-info" id="registerDebugInfo"></div>
        </div>

        <div class="footer-text">
            <p style="margin-bottom: 10px; font-size: 14px;">Already have an account? <a href="login.html">Sign in</a></p>
            <p>© 2026 SchoolHub. All rights reserved.</p>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.protocol === "file:" || !window.location.origin || window.location.origin === "null")
            ? "http://127.0.0.1:8000" : window.location.origin;
        let debugMode = true;

        function log(message, logType = "info") {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = `[${timestamp}] [${String(logType).toUpperCase()}]`;
            console.log(prefix + " " + message);
        }

        function showDebugInfo(message, elementId) {
            if (debugMode) {
                const debugEl = document.getElementById(elementId);
                const timestamp = new Date().toLocaleTimeString();
                debugEl.innerHTML += `<div>[${timestamp}] ${message}</div>`;
                debugEl.scrollTop = debugEl.scrollHeight;
            }
        }

        function switchTab(tabName) {
            log("Switching to tab: " + tabName);
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        function showAlert(message, alertType = "error") {
            log("Alert [" + alertType + "]: " + message);
            const alertMap = { success: "successAlert", error: "errorAlert", info: "infoAlert" };
            const alertId = alertMap[alertType] || "errorAlert";
            const alert = document.getElementById(alertId);
            alert.textContent = message;
            alert.classList.add("show");
            if (alertType === "success") {
                setTimeout(() => { window.location.href = "professional_dashboard.html"; }, 1500);
            } else {
                setTimeout(() => alert.classList.remove("show"), 5000);
            }
        }

        function checkPasswordStrength() {
            const password = document.getElementById("registerPassword").value;
            const bar = document.getElementById("strengthBar");
            const hint = document.getElementById("passwordHint");
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.length >= 12) strength += 25;
            if (/[A-Z]/.test(password)) strength += 25;
            if (/[0-9]/.test(password)) strength += 12.5;
            if (/[^A-Za-z0-9]/.test(password)) strength += 12.5;
            bar.style.width = strength + "%";
            if (strength < 30) { bar.style.background = "#EF4444"; hint.textContent = "Weak password"; }
            else if (strength < 70) { bar.style.background = "#F59E0B"; hint.textContent = "Medium strength"; }
            else { bar.style.background = "#10B981"; hint.textContent = "Strong password"; }
        }

        function parseErrorDetail(data) {
            if (!data) return "Unknown error";
            const detail = data.detail;
            if (!detail) return "Request failed";
            if (typeof detail === "string") return detail;
            if (Array.isArray(detail)) return detail.map(d => {
                const field = Array.isArray(d.loc) ? d.loc.join(".") : "field";
                return `${field}: ${d.msg}`;
            }).join(", ");
            try { return JSON.stringify(detail); } catch (e) { return "Request failed"; }
        }

        async function handleLogin(event) {
            event.preventDefault();
            log("Login form submitted");
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;
            const loginBtn = document.getElementById("loginBtn");
            if (!email || !password) { showAlert("Please enter email and password", "error"); return; }
            try {
                loginBtn.classList.add("loading");
                loginBtn.disabled = true;
                loginBtn.innerHTML = '<span class="loading-spinner"></span>Signing in...';
                const response = await fetch(API_BASE + "/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(parseErrorDetail(data));
                localStorage.setItem("access_token", data.access_token);
                localStorage.setItem("user_role", data.role || "user");
                localStorage.setItem("user_email", email);
                localStorage.setItem("school_id", data.school_id);
                localStorage.setItem("user_full_name", data.full_name || "");
                localStorage.setItem("school_name", data.school_name || "");
                log("Login successful");
                showAlert("Login successful! Redirecting...", "success");
            } catch (error) {
                log("Login error: " + error.message);
                showAlert("Login failed: " + error.message, "error");
                loginBtn.classList.remove("loading");
                loginBtn.disabled = false;
                loginBtn.innerHTML = "Sign In";
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            log("Registration form submitted");
            const schoolName = document.getElementById("registerSchoolName").value;
            const adminName = document.getElementById("registerAdminName").value;
            const email = document.getElementById("registerEmail").value;
            const password = document.getElementById("registerPassword").value;
            const passwordConfirm = document.getElementById("registerPasswordConfirm").value;
            const registerBtn = document.getElementById("registerBtn");

            if (!schoolName || !adminName || !email || !password) { showAlert("Please fill all required fields (*)", "error"); return; }
            if (password.length < 8) { showAlert("Password must be at least 8 characters", "error"); return; }
            if (password !== passwordConfirm) { showAlert("Passwords do not match", "error"); return; }

            try {
                registerBtn.classList.add("loading");
                registerBtn.disabled = true;
                registerBtn.innerHTML = '<span class="loading-spinner"></span>Creating Account...';
                const userResponse = await fetch(API_BASE + "/auth/register", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ school_name: schoolName, email, password, admin_name: adminName })
                });
                const userData = await userResponse.json();
                if (!userResponse.ok) throw new Error(parseErrorDetail(userData) || "Failed to create account");

                if (userData.access_token) {
                    localStorage.setItem("access_token", userData.access_token);
                    localStorage.setItem("user_role", userData.role || "admin");
                    localStorage.setItem("user_email", email);
                    localStorage.setItem("school_id", userData.school_id);
                    localStorage.setItem("user_full_name", userData.full_name || "");
                    localStorage.setItem("school_name", userData.school_name || "");
                    showAlert("Account created successfully! Redirecting...", "success");
                    return;
                }

                const loginResponse = await fetch(API_BASE + "/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const loginData = await loginResponse.json();
                if (loginResponse.ok) {
                    localStorage.setItem("access_token", loginData.access_token);
                    localStorage.setItem("user_role", loginData.role || "admin");
                    localStorage.setItem("user_email", email);
                    localStorage.setItem("school_id", loginData.school_id);
                    localStorage.setItem("user_full_name", loginData.full_name || "");
                    localStorage.setItem("school_name", loginData.school_name || "");
                    showAlert("Account created successfully! Redirecting...", "success");
                } else {
                    showAlert("Account created! Please login manually.", "info");
                    setTimeout(() => {
                        document.getElementById("loginEmail").value = email;
                        document.getElementById("loginPassword").value = password;
                        switchTab('login');
                    }, 1500);
                }
            } catch (error) {
                log("Registration error: " + error.message);
                showAlert("Registration failed: " + error.message, "error");
                registerBtn.classList.remove("loading");
                registerBtn.disabled = false;
                registerBtn.innerHTML = "Create Account";
            }
        }

        window.addEventListener("load", () => {
            const token = localStorage.getItem("access_token");
            if (token) window.location.href = "professional_dashboard.html";
        });

        document.addEventListener("keydown", (e) => {
            if (e.ctrlKey && e.key === 'd') {
                debugMode = !debugMode;
                document.querySelectorAll('.debug-info').forEach(el => el.classList.toggle('show'));
            }
        });
    </script>
    <script src="js/branding.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/empty-states.js"></script>
    <script src="js/success-anim.js"></script>
    <script src="js/form-validation.js"></script>
    <script src="js/hope-theme.js"></script>
</body>
</html>
