<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Documents - SchoolHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/animations.css">
<link rel="stylesheet" href="css/dark-mode.css">
<link rel="stylesheet" href="css/empty-states.css">
<link rel="stylesheet" href="css/success-anim.css">
<link rel="stylesheet" href="css/hope-theme.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  body.hope-theme.hope-portal-page { background: #F7F5FF; color: var(--ht-dark, #1E1B4B); }

  .topbar {
    background: linear-gradient(135deg, #7C5CE0 0%, #6D4DC7 100%);
    color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 4px 24px rgba(124, 92, 224, 0.25);
    position: sticky; top: 0; z-index: 50; overflow: hidden;
  }
  .topbar::before {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.06) 75%, transparent 100%);
    background-size: 200% 100%; animation: htHeaderShine 5s linear infinite; pointer-events: none;
  }
  @keyframes htHeaderShine { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .topbar h1 {
    font-family: 'Poppins', sans-serif; font-size: 1.1rem; margin: 0; position: relative; z-index: 1;
    background: linear-gradient(90deg, #ffffff 0%, #FFD4AC 50%, #ffffff 100%);
    background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    animation: htTitleGradient 4s ease-in-out infinite;
  }
  @keyframes htTitleGradient { 0%, 100% { background-position: 0% center; } 50% { background-position: 100% center; } }
  .topbar a.back { color: rgba(255,255,255,0.9); text-decoration: none; font-size: 0.9rem; font-weight: 600; position: relative; z-index: 1; }
  .topbar a.back:hover { color: var(--ht-accent, #F5A55C); }

  .container { max-width: 840px; margin: 1.5rem auto; padding: 0 1rem; position: relative; z-index: 2; }

  .card { background: #fff; border-radius: 20px; padding: 1.5rem; margin-bottom: 1.2rem; box-shadow: 0 4px 20px rgba(124, 92, 224, 0.08); border: 1px solid rgba(124, 92, 224, 0.08); }
  .card h2 { font-family: 'Poppins', sans-serif; font-size: 1rem; margin: 0 0 1rem; color: var(--ht-primary-dark, #6244C7); }

  select, input[type="text"], input[type="file"] {
    padding: 0.6rem 0.8rem; border: 1.5px solid var(--ht-border, #E5E1F5); border-radius: 10px;
    font-size: 0.9rem; font-family: inherit; background: #fff; color: var(--ht-dark, #1E1B4B);
    transition: all 0.15s;
  }
  select:focus, input:focus { outline: none; border-color: #7C5CE0; box-shadow: 0 0 0 4px rgba(124, 92, 224, 0.12); }

  .row-form { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .row-form label { font-weight: 700; font-size: 0.88rem; color: var(--ht-primary-dark, #6244C7); }
  .row-form button {
    padding: 0.6rem 1.2rem; border: none; border-radius: 10px;
    background: linear-gradient(135deg, #7C5CE0, #6244C7); color: #fff; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 14px rgba(124, 92, 224, 0.3); font-family: inherit;
  }
  .row-form button:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124, 92, 224, 0.45); }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.7rem 0.6rem; border-bottom: 1px solid rgba(124, 92, 224, 0.06); }
  th { color: var(--ht-primary-dark, #6244C7); font-weight: 700; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.05em; }
  tbody tr:hover { background: rgba(124, 92, 224, 0.03); }

  table button { padding: 0.4rem 0.85rem; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 0.82rem; font-family: inherit; }
  table button:first-child { background: linear-gradient(135deg, #7C5CE0, #6244C7); color: #fff; }
  table button:last-child { background: linear-gradient(135deg, #EF4444, #DC2626); color: #fff; }
  table button:hover { transform: translateY(-1px); }

  .msg { font-size: 0.85rem; margin-top: 0.5rem; font-weight: 500; }
  .msg.error { color: #991B1B; }
  .msg.ok { color: #065F46; }

  .doc-tag { display: inline-block; padding: 0.25rem 0.7rem; border-radius: 999px; background: var(--ht-primary-lighter, #EDE9FE); color: var(--ht-primary-dark, #6244C7); font-size: 0.78rem; font-weight: 700; }
</style>
</head>
<body class="hope-theme hope-portal-page">
  <div class="topbar">
    <h1>Student Documents</h1>
    <a class="back" href="professional_dashboard.html">← Back to dashboard</a>
  </div>

  <div class="container">
    <div class="card">
      <div class="row-form">
        <label for="classSelect">Class:</label>
        <select id="classSelect"><option value="">Select class</option></select>
        <label for="studentSelect">Student:</label>
        <select id="studentSelect"><option value="">Select student</option></select>
      </div>
    </div>

    <div class="card">
      <h2>📤 Upload Document / Photo</h2>
      <div class="row-form">
        <select id="docType">
          <option value="profile_photo">Card Photo (profile)</option>
          <option value="id_card">ID Card scan</option>
          <option value="b_form">B-Form / CNIC</option>
          <option value="test_paper">Test Paper photo</option>
          <option value="other">Other</option>
        </select>
        <input type="text" id="docLabel" placeholder="Label (optional, e.g. 'July test')" style="width:220px" />
        <input type="file" id="docFile" accept="image/*,application/pdf" />
        <button onclick="uploadDoc()">Upload</button>
      </div>
      <div class="msg" id="uploadMsg"></div>
    </div>

    <div class="card">
      <h2>📁 Uploaded Documents</h2>
      <table>
        <thead><tr><th>Type</th><th>Label</th><th>File</th><th>Uploaded</th><th></th><th></th></tr></thead>
        <tbody id="docTable"></tbody>
      </table>
    </div>
  </div>

<script>
const API_BASE = (window.location.protocol === "file:" || !window.location.origin || window.location.origin === "null")
    ? "http://127.0.0.1:8000" : window.location.origin;

const token = localStorage.getItem("access_token");
if (!token) window.location.href = "login.html";

async function authFetch(path, options = {}) {
  const headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "Request failed");
  return data;
}

let allStudents = [];

async function init() {
  allStudents = await authFetch("/students");
  const classes = [...new Set(allStudents.map(s => s.class_name))].sort();
  document.getElementById("classSelect").innerHTML = `<option value="">Select class</option>` + classes.map(c => `<option value="${c}">${c}</option>`).join("");
}

document.getElementById("classSelect").addEventListener("change", (e) => {
  const cls = e.target.value;
  const filtered = allStudents.filter(s => s.class_name === cls);
  document.getElementById("studentSelect").innerHTML = `<option value="">Select student</option>` +
    filtered.map(s => `<option value="${s.id}">${s.roll_number} - ${s.name}</option>`).join("");
  document.getElementById("docTable").innerHTML = "";
});

document.getElementById("studentSelect").addEventListener("change", loadDocs);

async function loadDocs() {
  const studentId = document.getElementById("studentSelect").value;
  if (!studentId) { document.getElementById("docTable").innerHTML = ""; return; }
  const docs = await authFetch(`/students/${studentId}/documents`);
  document.getElementById("docTable").innerHTML = docs.map(d => `
    <tr>
      <td><span class="doc-tag">${d.doc_type}</span></td>
      <td>${d.label || "—"}</td>
      <td>${d.file_name || "—"}</td>
      <td>${new Date(d.created_at).toLocaleDateString()}</td>
      <td><button onclick="viewDoc(${studentId}, ${d.id})">View</button></td>
      <td><button onclick="deleteDoc(${studentId}, ${d.id})">Delete</button></td>
    </tr>`).join("") || "<tr><td colspan='6'>No documents uploaded yet.</td></tr>";
}

async function uploadDoc() {
  const msg = document.getElementById("uploadMsg");
  msg.textContent = ""; msg.className = "msg";
  const studentId = document.getElementById("studentSelect").value;
  if (!studentId) { msg.textContent = "Select a student first."; msg.classList.add("error"); return; }
  const file = document.getElementById("docFile").files[0];
  if (!file) { msg.textContent = "Choose a file first."; msg.classList.add("error"); return; }
  const docType = document.getElementById("docType").value;
  const label = document.getElementById("docLabel").value;
  const form = new FormData();
  form.append("file", file);
  const params = new URLSearchParams({ doc_type: docType });
  if (label) params.append("label", label);
  try {
    await authFetch(`/students/${studentId}/documents?${params.toString()}`, { method: "POST", body: form });
    msg.textContent = "Uploaded successfully."; msg.classList.add("ok");
    document.getElementById("docFile").value = "";
    document.getElementById("docLabel").value = "";
    await loadDocs();
  } catch (err) { msg.textContent = err.message; msg.classList.add("error"); }
}

async function viewDoc(studentId, docId) {
  try { const { url } = await authFetch(`/students/${studentId}/documents/${docId}/url`); window.open(url, "_blank"); }
  catch (err) { alert(err.message); }
}

async function deleteDoc(studentId, docId) {
  if (!confirm("Delete this document?")) return;
  try {
    await authFetch(`/students/${studentId}/documents/${docId}`, { method: "DELETE" });
    await loadDocs();
  } catch (err) { alert(err.message); }
}

init();
</script>
    <script src="js/branding.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/skeleton.js"></script>
    <script src="js/empty-states.js"></script>
    <script src="js/success-anim.js"></script>
    <script src="js/hope-theme.js"></script>
</body>
</html>
