<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Documents - SchoolHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/animations.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --teal-900: #0a5a54; --teal-700: #0c6e6b; --teal-500: #14958c; --teal-100: #e3f3f1;
    --clay-500: #c87757; --ink-900: #1a2b29; --ink-500: #5c6b69;
    --paper: #fbfaf7; --card: #ffffff; --line: #e6e8e5;
    --success: #1a8c5c; --danger: #c4453b;
  }
  * { box-sizing: border-box; }
  body { background: var(--paper); margin: 0; font-family: 'Inter', sans-serif; color: var(--ink-900); }
  .topbar { background: linear-gradient(165deg, var(--teal-900), var(--teal-700) 70%); color: #fff; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
  .topbar h1 { font-family: 'Poppins', sans-serif; }
  .container { max-width: 800px; margin: 1.5rem auto; padding: 0 1rem; }
  .card { background: var(--card); border-radius: 14px; padding: 1.3rem 1.5rem; margin-bottom: 1.2rem; box-shadow: 0 2px 12px rgba(10,90,84,0.06); border: 1px solid var(--line); }
  select, input, button { padding: 0.55rem 0.75rem; border: 1.5px solid var(--line); border-radius: 8px; font-size: 0.9rem; font-family: inherit; }
  select:focus, input:focus { outline: none; border-color: var(--teal-500); box-shadow: 0 0 0 3px var(--teal-100); }
  .row-form { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
  .row-form button { background: var(--teal-700); color: #fff; border: none; cursor: pointer; font-weight: 600; }
  .row-form button:hover { background: var(--teal-900); }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th, td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-500); font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.02em; }
  .msg { font-size: 0.85rem; margin-top: 0.5rem; }
  .msg.error { color: var(--danger); } .msg.ok { color: var(--success); }
  .doc-tag { display:inline-block; padding:0.15rem 0.6rem; border-radius:999px; background:var(--teal-100); color:var(--teal-900); font-size:0.78rem; font-weight: 600; }
  a.back { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.9rem; }
</style>
</head>
<body>
  <div class="topbar">
    <h1 style="font-size:1.1rem;margin:0;">Student Documents</h1>
    <a class="back" href="professional_dashboard.html">← Back to dashboard</a>
  </div>

  <div class="container">
    <div class="card">
      <div class="row-form">
        <label for="classSelect">Class:</label>
        <select id="classSelect"><option value="">Select class</option></select>
        <label for="studentSelect">Student:</label>
        <select id="studentSelect"><option value="">Select student</option></select>
      </div>
    </div>

    <div class="card">
      <h2 style="font-size:1rem;">Upload Document / Photo</h2>
      <div class="row-form">
        <select id="docType">
          <option value="profile_photo">Card Photo (profile)</option>
          <option value="id_card">ID Card scan</option>
          <option value="b_form">B-Form / CNIC</option>
          <option value="test_paper">Test Paper photo</option>
          <option value="other">Other</option>
        </select>
        <input type="text" id="docLabel" placeholder="Label (optional, e.g. 'July test')" style="width:220px" />
        <input type="file" id="docFile" accept="image/*,application/pdf" />
        <button onclick="uploadDoc()">Upload</button>
      </div>
      <div class="msg" id="uploadMsg"></div>
    </div>

    <div class="card">
      <h2 style="font-size:1rem;">Uploaded Documents</h2>
      <table>
        <thead><tr><th>Type</th><th>Label</th><th>File</th><th>Uploaded</th><th></th><th></th></tr></thead>
        <tbody id="docTable"></tbody>
      </table>
    </div>
  </div>

<script>
const API_BASE = (window.location.protocol === "file:" || !window.location.origin || window.location.origin === "null")
    ? "http://127.0.0.1:8000"
    : window.location.origin;

const token = localStorage.getItem("access_token");
if (!token) window.location.href = "login.html";

async function authFetch(path, options = {}) {
  const headers = { ...(options.headers || {}), Authorization: `Bearer ${token}` };
  const res = await fetch(`${API_BASE}${path}`, { ...options, headers });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || "Request failed");
  return data;
}

let allStudents = [];

async function init() {
  allStudents = await authFetch("/students");
  const classes = [...new Set(allStudents.map(s => s.class_name))].sort();
  document.getElementById("classSelect").innerHTML =
    `<option value="">Select class</option>` + classes.map(c => `<option value="${c}">${c}</option>`).join("");
}

document.getElementById("classSelect").addEventListener("change", (e) => {
  const cls = e.target.value;
  const filtered = allStudents.filter(s => s.class_name === cls);
  document.getElementById("studentSelect").innerHTML =
    `<option value="">Select student</option>` +
    filtered.map(s => `<option value="${s.id}">${s.roll_number} - ${s.name}</option>`).join("");
  document.getElementById("docTable").innerHTML = "";
});

document.getElementById("studentSelect").addEventListener("change", loadDocs);

async function loadDocs() {
  const studentId = document.getElementById("studentSelect").value;
  if (!studentId) { document.getElementById("docTable").innerHTML = ""; return; }
  const docs = await authFetch(`/students/${studentId}/documents`);
  document.getElementById("docTable").innerHTML = docs.map(d => `
    <tr>
      <td><span class="doc-tag">${d.doc_type}</span></td>
      <td>${d.label || "—"}</td>
      <td>${d.file_name || "—"}</td>
      <td>${new Date(d.created_at).toLocaleDateString()}</td>
      <td><button onclick="viewDoc(${studentId}, ${d.id})">View</button></td>
      <td><button onclick="deleteDoc(${studentId}, ${d.id})" style="background:#dc2626;color:#fff;border:none;">Delete</button></td>
    </tr>`).join("") || "<tr><td colspan='6'>No documents uploaded yet.</td></tr>";
}

async function uploadDoc() {
  const msg = document.getElementById("uploadMsg");
  msg.textContent = ""; msg.className = "msg";
  const studentId = document.getElementById("studentSelect").value;
  if (!studentId) { msg.textContent = "Select a student first."; msg.classList.add("error"); return; }

  const file = document.getElementById("docFile").files[0];
  if (!file) { msg.textContent = "Choose a file first."; msg.classList.add("error"); return; }

  const docType = document.getElementById("docType").value;
  const label = document.getElementById("docLabel").value;

  const form = new FormData();
  form.append("file", file);

  const params = new URLSearchParams({ doc_type: docType });
  if (label) params.append("label", label);

  try {
    await authFetch(`/students/${studentId}/documents?${params.toString()}`, {
      method: "POST",
      body: form,
    });
    msg.textContent = "Uploaded successfully."; msg.classList.add("ok");
    document.getElementById("docFile").value = "";
    document.getElementById("docLabel").value = "";
    await loadDocs();
  } catch (err) {
    msg.textContent = err.message; msg.classList.add("error");
  }
}

async function viewDoc(studentId, docId) {
  try {
    const { url } = await authFetch(`/students/${studentId}/documents/${docId}/url`);
    window.open(url, "_blank");
  } catch (err) {
    alert(err.message);
  }
}

async function deleteDoc(studentId, docId) {
  if (!confirm("Delete this document?")) return;
  try {
    await authFetch(`/students/${studentId}/documents/${docId}`, { method: "DELETE" });
    await loadDocs();
  } catch (err) {
    alert(err.message);
  }
}

init();
</script>
    <script src="js/branding.js"></script>
    <script src="js/animations.js"></script>
</body>
</html>
